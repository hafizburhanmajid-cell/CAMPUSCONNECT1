<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Item Details | CampusConnect</title>

    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-slate-50 text-slate-900">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200">

        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

            <a href="index.html"
                class="text-2xl font-bold text-indigo-600">
                CampusConnect
            </a>

            <div class="hidden md:flex items-center gap-6">

                <a href="index.html"
                    class="text-slate-600 hover:text-indigo-600">
                    Home
                </a>

                <a href="events.html"
                    class="text-slate-600 hover:text-indigo-600">
                    Events
                </a>

                <a href="planner.html"
                    class="text-slate-600 hover:text-indigo-600">
                    Study Planner
                </a>

                <a href="lost-found.html"
                    class="text-indigo-600 font-semibold">
                    Lost & Found
                </a>

                <a href="study-partners.html"
                    class="text-slate-600 hover:text-indigo-600">
                    Study Partners
                </a>

            </div>

        </div>

    </nav>


    <!-- Item Details -->
    <main class="max-w-4xl mx-auto px-6 py-12">

        <a href="lost-found.html"
            class="inline-block text-indigo-600 font-semibold mb-6 hover:translate-x-1 transition">
            ← Back to Lost & Found
        </a>


        <div class="bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm">

            <div class="h-56 bg-slate-100 flex items-center justify-center">

                <span id="itemIcon" class="text-8xl">
                    👛
                </span>

            </div>


            <div class="p-8">

                <div class="flex items-center justify-between mb-4">

                    <h1 id="itemTitle"
                        class="text-3xl md:text-4xl font-bold">
                        Black Wallet
                    </h1>

                    <span id="itemStatus"
                        class="text-sm font-semibold bg-red-100 text-red-600 px-4 py-2 rounded-full">
                        Lost
                    </span>

                </div>


                <p id="itemDescription"
                    class="text-slate-500 text-lg mb-8">
                    Black leather wallet lost near the university library.
                </p>


                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">

                    <div class="bg-slate-50 rounded-xl p-4">

                        <p class="text-sm text-slate-500">
                            Location
                        </p>

                        <p id="itemLocation"
                            class="font-semibold mt-1">
                            Library
                        </p>

                    </div>


                    <div class="bg-slate-50 rounded-xl p-4">

                        <p class="text-sm text-slate-500">
                            Date
                        </p>

                        <p id="itemDate"
                            class="font-semibold mt-1">
                            August 8, 2026
                        </p>

                    </div>

                </div>


                <button
                    id="contactButton"
                    class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition cursor-pointer">
                    Contact About This Item
                </button>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400">

        <div class="max-w-7xl mx-auto px-6 py-10 text-center">

            <h3 class="text-xl font-bold text-white mb-2">
                CampusConnect
            </h3>

            <p>
                Your Campus. One Platform.
            </p>

        </div>

    </footer>


    <script src="./js/item-details.js"></script>

</body>

</html>
