<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact About Item | CampusConnect</title>

    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-slate-50 text-slate-900">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200">

        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

            <a href="index.html"
                class="text-2xl font-bold text-indigo-600">
                CampusConnect
            </a>

            <div class="hidden md:flex items-center gap-6">

                <a href="index.html"
                    class="text-slate-600 hover:text-indigo-600">
                    Home
                </a>

                <a href="events.html"
                    class="text-slate-600 hover:text-indigo-600">
                    Events
                </a>

                <a href="planner.html"
                    class="text-slate-600 hover:text-indigo-600">
                    Study Planner
                </a>

                <a href="lost-found.html"
                    class="text-indigo-600 font-semibold">
                    Lost & Found
                </a>

                <a href="study-partners.html"
                    class="text-slate-600 hover:text-indigo-600">
                    Study Partners
                </a>

            </div>

        </div>

    </nav>


    <!-- Header -->
    <section class="bg-indigo-600 text-white">

        <div class="max-w-7xl mx-auto px-6 py-16">

            <p class="text-indigo-200 font-semibold mb-2">
                LOST & FOUND
            </p>

            <h1 class="text-4xl md:text-5xl font-bold mb-4">
                Contact About This Item
            </h1>

            <p class="text-indigo-100 max-w-2xl">
                Send a message to the person who reported this item.
            </p>

        </div>

    </section>


    <!-- Contact Form -->
    <main class="max-w-2xl mx-auto px-6 py-12">

        <div class="bg-white border border-slate-200 rounded-2xl p-6 md:p-8 shadow-sm">

            <h2 class="text-2xl font-bold mb-2">
                Send a Message
            </h2>

            <p class="text-slate-500 mb-8">
                Fill in your information and message below.
            </p>


            <form id="contactForm" class="space-y-6">

                <!-- Name -->
                <div>

                    <label
                        for="contactName"
                        class="block text-sm font-semibold text-slate-700 mb-2">
                        Your Name
                    </label>

                    <input
                        id="contactName"
                        type="text"
                        placeholder="Enter your name"
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
                    >

                </div>


                <!-- Email -->
                <div>

                    <label
                        for="contactEmail"
                        class="block text-sm font-semibold text-slate-700 mb-2">
                        Email
                    </label>

                    <input
                        id="contactEmail"
                        type="email"
                        placeholder="Enter your email"
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
                    >

                </div>


                <!-- Message -->
                <div>

                    <label
                        for="contactMessage"
                        class="block text-sm font-semibold text-slate-700 mb-2">
                        Message
                    </label>

                    <textarea
                        id="contactMessage"
                        rows="5"
                        placeholder="Write your message..."
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 resize-none"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition cursor-pointer">
                    Send Message
                </button>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400">

        <div class="max-w-7xl mx-auto px-6 py-10 text-center">

            <h3 class="text-xl font-bold text-white mb-2">
                CampusConnect
            </h3>

            <p>
                Your Campus. One Platform.
            </p>

        </div>

    </footer>


    <script src="./js/contact.js"></script>

</body>

</html>
