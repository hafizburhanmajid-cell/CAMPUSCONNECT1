<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register for Event | CampusConnect</title>

    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-slate-50 text-slate-900">

    <!-- Navbar -->

    <nav class="bg-white border-b border-slate-200">

        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

            <a href="index.html"
                class="text-2xl font-bold text-indigo-600">
                CampusConnect
            </a>

            <div class="hidden md:flex items-center gap-6">

                <a href="index.html"
                    class="text-slate-600 hover:text-indigo-600 transition-colors">
                    Home
                </a>

                <a href="events.html"
                    class="text-slate-600 hover:text-indigo-600 transition-colors">
                    Events
                </a>

                <a href="planner.html"
                    class="text-slate-600 hover:text-indigo-600 transition-colors">
                    Study Planner
                </a>

                <a href="lost-found.html"
                    class="text-slate-600 hover:text-indigo-600 transition-colors">
                    Lost & Found
                </a>

                <a href="study-partners.html"
                    class="text-slate-600 hover:text-indigo-600 transition-colors">
                    Study Partners
                </a>

            </div>

        </div>

    </nav>


    <!-- Registration Section -->

    <section class="max-w-3xl mx-auto px-6 py-16">

        <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm">

            <p class="text-indigo-600 font-semibold mb-2">
                EVENT REGISTRATION
            </p>

            <h1 class="text-3xl font-bold mb-3">
                Register for Event
            </h1>

            <p class="text-slate-500 mb-8">
                Fill in your details to register for this event.
            </p>


            <form id="registrationForm">

                <!-- Student Name -->

                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="studentName"
                        placeholder="Enter your name"
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
                    >

                </div>


                <!-- Email -->

                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
                    >

                </div>


                <!-- Department -->

                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        placeholder="e.g. Computer Science"
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
                    >

                </div>


                <!-- Event -->

                <div class="mb-6">

                    <label class="block font-semibold mb-2">
                        Event
                    </label>

                    <input
                        type="text"
                        id="eventName"
                        value="Web Development Workshop"
                        readonly
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl bg-slate-100 outline-none"
                    >

                </div>


                <!-- Submit Button -->

                <button
                    type="submit"
                    class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition cursor-pointer">
                    Submit
                </button>

            </form>


            <!-- Success Message -->

            <div
                id="successMessage"
                class="hidden mt-6 p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl text-center font-semibold">
                Registration successful! 🎉
            </div>


        </div>

    </section>


    <!-- Footer -->

    <footer class="bg-slate-900 text-slate-400">

        <div class="max-w-7xl mx-auto px-6 py-10 text-center">

            <h3 class="text-xl font-bold text-white mb-2">
                CampusConnect
            </h3>

            <p>
                Your Campus. One Platform.
            </p>

        </div>

    </footer>


    <script src="./js/register.js"></script>

</body>

</html>
