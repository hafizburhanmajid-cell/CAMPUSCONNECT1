<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact About Item | CampusConnect</title>

    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-slate-50 text-slate-900">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200">

        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

            <a href="index.html"
                class="text-2xl font-bold text-indigo-600">
                CampusConnect
            </a>

            <div class="hidden md:flex items-center gap-6">

                <a href="index.html"
                    class="text-slate-600 hover:text-indigo-600">
                    Home
                </a>

                <a href="events.html"
                    class="text-slate-600 hover:text-indigo-600">
                    Events
                </a>

                <a href="planner.html"
                    class="text-slate-600 hover:text-indigo-600">
                    Study Planner
                </a>

                <a href="lost-found.html"
                    class="text-indigo-600 font-semibold">
                    Lost & Found
                </a>

                <a href="study-partners.html"
                    class="text-slate-600 hover:text-indigo-600">
                    Study Partners
                </a>

                <a href="profile.html"
                    class="text-slate-600 hover:text-indigo-600">
                    Profile
                </a>

            </div>

        </div>

    </nav>


    <!-- Contact Form -->

    <section class="max-w-3xl mx-auto px-6 py-16">

        <a href="item-details.html"
            class="inline-block text-indigo-600 font-semibold mb-6 hover:translate-x-1 transition">
            ← Back to Item Details
        </a>


        <div class="bg-white border border-slate-200 rounded-2xl p-8 shadow-sm">

            <p class="text-indigo-600 font-semibold mb-2">
                LOST & FOUND
            </p>

            <h1 class="text-3xl font-bold mb-3">
                Contact About This Item
            </h1>

            <p class="text-slate-500 mb-8">
                Send a message to the person who reported this item.
            </p>


            <form id="contactForm">

                <!-- Name -->

                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="contactName"
                        placeholder="Enter your name"
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
                    >

                </div>


                <!-- Email -->

                <div class="mb-5">

                    <label class="block font-semibold mb-2">
                        Your Email
                    </label>

                    <input
                        type="email"
                        id="contactEmail"
                        placeholder="Enter your email"
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
                    >

                </div>


                <!-- Message -->

                <div class="mb-6">

                    <label class="block font-semibold mb-2">
                        Message
                    </label>

                    <textarea
                        id="contactMessage"
                        rows="5"
                        placeholder="Write your message..."
                        class="w-full px-4 py-3 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 resize-none"
                    ></textarea>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition cursor-pointer">
                    Send Message
                </button>

            </form>

        </div>

    </section>


    <!-- Footer -->

    <footer class="bg-slate-900 text-slate-400">

        <div class="max-w-7xl mx-auto px-6 py-10 text-center">

            <h3 class="text-xl font-bold text-white mb-2">
                CampusConnect
            </h3>

            <p>
                Your Campus. One Platform.
            </p>

        </div>

    </footer>


    <script src="./js/contact-item.js"></script>

</body>

</html>
